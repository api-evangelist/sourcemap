method: searched
source: https://www.sourcemap.com/ (certification badges + hero copy), https://www.sourcemap.com/technology/erp-integration
note: >-
  Sourcemap publishes no machine-readable contract, so every entry below is graded
  against PROSE the company publishes on its own marketing site, not against a spec.
  Where 0.12.0 asks for a domain-standard SIGNATURE inside the contract (a SCIM URN,
  an OData $metadata surface, an EPCIS/GS1 event shape, an X12/EDIFACT message type),
  none could be checked at all: api.sourcemap.com refuses every anonymous request
  with 403 and no OpenAPI, GraphQL SDL or AsyncAPI document exists on any host. Absence
  of a domain-standard signature here therefore means "not verifiable", not "not present".
