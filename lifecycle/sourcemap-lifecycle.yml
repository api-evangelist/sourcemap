    behind HTTP Basic auth (WWW-Authenticate: Basic realm=""). An unauthenticated
    caller, human or agent, gets 401 and 16 bytes. A StatusPage pointer IS emitted
    because the surface genuinely exists and is operated by the provider; readers
    should note it cannot be consumed without credentials.
