aid: sourcemap
name: Sourcemap
description: 'Sourcemap is an enterprise supply chain transparency and due diligence
  software company, founded at the MIT Media Lab by Leonardo Bonanni and headquartered
  in New York. Its platform performs n-tier supply chain mapping, automated sub-supplier
  discovery, bill-of-materials mapping, transaction-level chain-of-custody traceability,
  supplier watchlist screening and AI document review, so that brands and manufacturers
  can meet regulatory obligations including the EU Deforestation Regulation (EUDR),
  the Uyghur Forced Labor Prevention Act (UFLPA), the Corporate Sustainability Due
  Diligence Directive (CSDDD), CTPAT, conflict minerals rules and Section 232 tariff
  and customs enforcement. Sourcemap describes a real-time RESTful API and a data
  pipeline that moves structured data in both directions with SAP, Salesforce Net
  Zero Cloud, Databricks and the EU TRACES customs portal, but that API is sold and
  provisioned as part of an enterprise engagement: there is no public developer portal,
  no published API reference, no pricing page and no machine-readable contract on
  any Sourcemap host. Customers include Ferrero, Hershey, Woolworths and AG1.'
