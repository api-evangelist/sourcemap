apis:
- name: Sourcemap Platform API
  description: 'Sourcemap describes a secure real-time RESTful API used to integrate
    the traceability platform with ERP and enterprise data stacks (SAP, Salesforce
    Net Zero Cloud, Databricks) and with customs portals such as EU TRACES. The API
    host api.sourcemap.com resolves and answers, but every path is refused to an
    anonymous caller: the Azure Application Gateway edge returns 403 Access Forbidden
    with x-robots-tag noindex, and the Kong router behind it answers /v1/* with "no
    Route matched with those values". No OpenAPI, Swagger, GraphQL, AsyncAPI or MCP
    manifest is published on any Sourcemap host, and there is no public API reference
    to read. Access is provisioned through an enterprise engagement.'
  humanURL: https://www.sourcemap.com/technology/erp-integration
